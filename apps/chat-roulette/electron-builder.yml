appId: com.chatcontents.chatroulette
productName: ChatRoulette
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.png
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: ${productName}-${version}-portable.exe
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
