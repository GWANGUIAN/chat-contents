packages:
  - "packages/*"
  - "apps/*"

# 워크스페이스 전체에서 버전을 한 곳에 고정합니다.
# 패키지에서는 "zod": "catalog:" 처럼 참조하세요.
catalog:
  "@biomejs/biome": ^2.5.6
  "@types/node": ^22.12.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@types/ws": ^8.18.1
  electron: ^33.4.0
  electron-builder: ^25.1.8
  electron-vite: ^5.0.0
  electron-store: ^10.0.1
  lucide-react: ^0.469.0
  react: ^19.2.8
  react-dom: ^19.2.8
  turbo: ^2.10.8
  typescript: ^5.7.3
  vite: ^6.0.7
  vitest: ^2.1.8
  ws: ^8.21.1
  zod: ^3.24.1

# pnpm 10은 기본적으로 lifecycle script를 차단합니다. 필요한 것만 허용합니다.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - electron
  - electron-winstaller
  - esbuild
